name: Manual Pipeline Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - qa
          - staging
          - uat
      suite:
        description: 'Test Suite Scope'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - api
          - e2e
          - a11y
          - full
      browser:
        description: 'Browser Engine'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      notify:
        description: 'Send Completion Notification'
        required: false
        default: false
        type: boolean

concurrency:
  group: manual-run-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  manual-execution:
    name: Execute Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run QA Pipeline
        run: |
          echo "Executing suite ${{ inputs.suite }} on ${{ inputs.environment }} with ${{ inputs.browser }}..."
          npm run qa:smoke
          npm run docs:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-run-artifacts-${{ inputs.environment }}
          path: artifacts/
          retention-days: 30
