name: Nightly Regression

on:
  schedule:
    # 01:00 WIB (UTC+7) = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-regression
  cancel-in-progress: false

jobs:
  nightly-run:
    name: Full Regression & A11y
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-bundle
          path: artifacts/bundles/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-docs
          path: artifacts/docs/
          retention-days: 30
